<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player VixSrc Isolato</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .player-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <!-- L'URL viene caricato come embed -->
    <iframe 
      src="https://vixsrc.to/movie/786892" 
      allowfullscreen="true" 
      webkitallowfullscreen="true" 
      mozallowfullscreen="true"
      scrolling="no"
      sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>
  </div>

</body>
</html>
